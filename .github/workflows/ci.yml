name: Maven verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Format and export sources
        run: |
          ./mvnw -B -ntp -pl pinot-controller com.diffplug.spotless:spotless-maven-plugin:2.43.0:apply > /tmp/format.log 2>&1 || { grep -E "ERROR|FAILURE" /tmp/format.log | head -8 | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
          find pinot-controller/src -name '*.java' | sort | while IFS= read -r file; do echo "::notice::FORMATTED=$file:$(gzip -c "$file" | base64 -w0)"; done
      - name: Slice build
        run: ./mvnw -B -ntp -pl pinot-bom -am verify
      - name: SPI and common tests
        run: ./mvnw -B -ntp -pl pinot-common -am verify
      - name: Segment tests
        run: ./mvnw -B -ntp -pl pinot-segment-local -am verify
      - name: Local query tests
        run: ./mvnw -B -ntp -pl pinot-core -am verify
      - name: Controller tests
        run: |
          ./mvnw -B -ntp -pl pinot-controller -am verify > /tmp/test.log 2>&1 || { grep -E "Caused by|Exception|Error|SEVERE" /tmp/test.log | grep -v "ERROR]" | tail -8 | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
      - name: Full build and quality checks
        run: ./mvnw -B -ntp verify
      - name: Fast development profile
        run: ./mvnw -B -ntp -Pfast-dev verify
