name: Maven verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Format sources
        run: ./mvnw -B -ntp spotless:apply
      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: formatted-sources
          path: |
            pinot-spi/src
            pinot-common/src
      - name: Slice build
        run: ./mvnw -B -ntp -pl pinot-bom -am verify
      - name: Full build and quality checks
        run: ./mvnw -B -ntp verify
      - name: Fast development profile
        run: ./mvnw -B -ntp -Pfast-dev verify
